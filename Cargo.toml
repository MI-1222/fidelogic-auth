[workspace]
resolver = "2"
members = [
    "crates/fidelogic-cli",
    "crates/fidelogic-core",
    "crates/fidelogic-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
fidelogic-core = { path = "crates/fidelogic-core", default-features = false }
curve25519-dalek = { version = "4.1.3", default-features = false }
argon2 = { version = "0.5.3", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
aes-gcm-siv = { version = "0.11", default-features = false }
aes = { version = "0.8", default-features = false }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
libc = { version = "0.2", default-features = false }
dlmalloc = { version = "0.2", default-features = false, features = ["global"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

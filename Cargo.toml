[workspace]
resolver = "2"
members = [
    "crates/fidelogic-cli",
    "crates/fidelogic-core",
    "crates/fidelogic-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
fidelogic-core = { path = "crates/fidelogic-core", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[package]
name = "fidelogic-core"
description = "Core cryptographic and authentication engine for fidelogic-auth"
version = "0.1.0"
edition = "2024"

[features]
default = ["std", "profile-vault"]
std = ["alloc", "zeroize/std"]
alloc = ["zeroize/alloc"]
# profile-lite: エッジ・高速認証向けの極小バイナリプロファイル。
profile-lite = ["alloc"]
# profile-vault: 完全なVault操作と暗号スイートを備えたプロファイル。
profile-vault = ["alloc", "profile-lite"]
# memlock: ネイティブ環境向けにmlockおよびmadviseによるメモリ保護を提供するプロファイル。
memlock = ["std", "dep:libc"]
# parallel: ネイティブ環境向けにマルチコア並列化パラメータ(レーン並列度)を既定値として選択するプロファイル。
parallel = ["std"]

[dependencies]
aes-gcm-siv = { workspace = true, features = ["alloc", "aes"] }
argon2 = { workspace = true, features = ["alloc", "zeroize"] }
chacha20poly1305 = { workspace = true, features = ["alloc"] }
curve25519-dalek = { workspace = true, features = ["alloc", "zeroize"] }
libc = { workspace = true, optional = true }
subtle = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
proptest = "1"
